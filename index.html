<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florecer Juntos - Te Amo Cuchito</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FFD700 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        .flowers-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 50px;
        }

        .flower {
            font-size: 60px;
            animation: dance 1.5s infinite ease-in-out;
        }

        .flower:nth-child(1) { animation-delay: 0s; }
        .flower:nth-child(2) { animation-delay: 0.2s; }
        .flower:nth-child(3) { animation-delay: 0.4s; }
        .flower:nth-child(4) { animation-delay: 0.6s; }
        .flower:nth-child(5) { animation-delay: 0.8s; }
        .flower:nth-child(6) { animation-delay: 1s; }
        .flower:nth-child(7) { animation-delay: 1.2s; }
        .flower:nth-child(8) { animation-delay: 1.4s; }

        @keyframes dance {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-30px) rotate(5deg) scale(1.1); }
            50% { transform: translateY(0) rotate(0deg) scale(1); }
            75% { transform: translateY(-30px) rotate(-5deg) scale(1.1); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        .message {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 700px;
            font-size: 20px;
            color: #8B4513;
            font-weight: bold;
            line-height: 1.6;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
            50% { box-shadow: 0 10px 60px rgba(255, 215, 0, 0.6); }
        }

        .heart {
            color: #FF1493;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flowers-container">
            <div class="flower">🌻</div>
            <div class="flower">🌼</div>
            <div class="flower">🌷</div>
            <div class="flower">🌺</div>
            <div class="flower">🏵️</div>
            <div class="flower">💐</div>
            <div class="flower">🌸</div>
            <div class="flower">✨</div>
        </div>

        <div class="message">
            <p>Te amo tan bonito como todas las flores amarillas y brillantes, <br> pero no tan luminosas como tu <span class="heart">💛</span> mi cuchito</p>
        </div>
    </div>
</body>
</html>
